name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Use Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14.x'

    # Every npm step runs from frontend/, because that is where
    # package.json, package-lock.json and every tool configuration live.
    # Run from the repository root - where there is no package manifest at
    # all - `npm ci` exits before installing anything and each later step
    # fails for the same reason.
    - name: Install dependencies
      working-directory: frontend
      run: npm ci

    - name: Run linting
      working-directory: frontend
      run: npm run lint

    # `--run` because `npm test` is `vitest`, which WATCHES by default and
    # would never return on a CI runner.
    - name: Run unit tests
      working-directory: frontend
      run: npm test -- --run

    - name: Build application
      working-directory: frontend
      run: npm run build

    - name: Deploy to staging
      if: github.ref == 'refs/heads/main'
      run: |
        # HUMAN ASSISTANCE NEEDED
        # Add deployment script or commands here
        # Example: npm run deploy:staging
        echo "Deployment to staging environment not implemented"