name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Use Node.js
      uses: actions/setup-node@v2
      with:
        # Node 22.x (>= 22.12.0). The previous '14.x' pin is not a supported
        # runtime: Node 14 is end-of-life, and the declared toolchain (Vite 4,
        # TypeScript 5, Vitest) plus frontend/package-lock.json are resolved
        # and verified on the 22.x line. frontend/package.json "engines"
        # records the same floor.
        node-version: '22.x'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run unit tests
      run: npm test

    - name: Build application
      run: npm run build

    - name: Deploy to staging
      if: github.ref == 'refs/heads/main'
      run: |
        # HUMAN ASSISTANCE NEEDED
        # Add deployment script or commands here
        # Example: npm run deploy:staging
        echo "Deployment to staging environment not implemented"