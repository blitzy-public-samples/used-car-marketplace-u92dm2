name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Moving OFF Node 14 is mandatory, not cosmetic: the repository root is an
    # npm workspace root, and npm workspaces require npm 7 or later. The Node 14
    # pin used here before this fix ships npm 6, which can neither resolve a
    # "workspaces" array nor read the committed lockfileVersion 3 lockfile;
    # Node 14 has also been end-of-life since 30 April 2023.
    #
    # 20.x is a TEMPORARY LEGACY PIN, not a supported runtime and not an LTS
    # line: Node 20 reached end-of-life on 30 April 2026 and receives no further
    # security patches. It is pinned here because it is the runtime this
    # toolchain was validated on and because it matches the engines floor in both
    # manifests, the README prerequisite and scripts/setup_environment.sh.
    # Moving to a supported line (Node 22 Maintenance LTS or Node 24 Active LTS)
    # requires major upgrades of Vite (4 -> 5+) and Vitest (0.34 -> 1+), so it is
    # separate modernization work - do not raise this pin without doing it.
    #
    # The npm cache below keys on the root package-lock.json, which this fix
    # commits; none existed before.
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    # This step previously failed with ENOENT (errno -2, exit code 254): it
    # ran at the repository root, which held no package.json, and no lockfile
    # was committed anywhere in the repository. Both now exist here, so the
    # command below is correct as written and installs the whole workspace.
    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run unit tests
      run: npm test

    - name: Build application
      run: npm run build

    - name: Deploy to staging
      if: github.ref == 'refs/heads/main'
      run: |
        # HUMAN ASSISTANCE NEEDED
        # Add deployment script or commands here
        # Example: npm run deploy:staging
        echo "Deployment to staging environment not implemented"